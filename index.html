  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>رفع اليد قبل الإجابة</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #fef6e4 0%, #e8f4fd 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 14px 20px;
    height: 100vh;
  }
  .header { text-align: center; margin-bottom: 4px; flex-shrink: 0; }
  .title { font-size: 20px; font-weight: 800; color: #3a3a5c; margin: 4px 0; }
  .subtitle { font-size: 13px; color: #888; font-weight: 600; }

  .levels-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    width: 100%; max-width: 500px; gap: 16px; flex: 1; margin-top: 8px;
  }
  .levels-screen.hidden { display: none; }
  .level-card {
    display: flex; align-items: center; gap: 16px; width: 100%;
    background: #fff; border-radius: 18px; padding: 14px 18px;
    box-shadow: 0 5px 16px rgba(0,0,0,0.1); cursor: pointer;
    border: 3px solid transparent; transition: transform .15s ease;
  }
  .level-card:active { transform: scale(0.97); }
  .level-card .icon { font-size: 36px; }
  .level-card .info { flex: 1; text-align: right; }
  .level-card .info .lvl-title { font-size: 17px; font-weight: 800; color: #3a3a5c; }
  .level-card .info .lvl-sub { font-size: 13px; color: #888; margin-top: 3px; }
  .level-card .stars-mini { font-size: 15px; color: #ffca3a; min-width: 46px; text-align: left; }

  .sound-toggle {
    position: fixed; top: 12px; left: 12px;
    background: #fff; border: none; border-radius: 50%;
    width: 40px; height: 40px; font-size: 18px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15); cursor: pointer; z-index: 10;
  }
  .sound-toggle:active { transform: scale(0.92); }

  .prompt-row {
    display: none; align-items: center; gap: 10px; margin: 4px 0 6px;
    width: 100%; max-width: 460px; flex-shrink: 0;
  }
  .prompt-row.show { display: flex; }
  .prompt-box {
    background: #fff; border-radius: 16px; padding: 10px 18px; flex: 1;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08); font-size: 16px; font-weight: 700;
    color: #5b4b8a; text-align: center;
  }
  .speak-btn {
    background: #6c5ce7; border: none; border-radius: 50%;
    width: 38px; height: 38px; font-size: 16px; color: white; cursor: pointer;
    box-shadow: 0 3px 10px rgba(108,92,231,0.35); flex-shrink: 0;
  }
  .speak-btn:active { transform: scale(0.92); }
  .speak-btn.speaking { animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { from { box-shadow: 0 0 0 0 rgba(108,92,231,0.5);} to { box-shadow: 0 0 0 8px rgba(108,92,231,0);} }

  .back-row { width: 100%; max-width: 500px; display: none; flex-shrink: 0; }
  .back-row.show { display: flex; }
  .back-btn { background: none; border: none; color: #6c5ce7; font-size: 13px; font-weight: 700; cursor: pointer; padding: 4px 2px; }

  .progress { display: flex; gap: 8px; margin: 4px 0 6px; display: none; flex-shrink: 0; }
  .progress.show { display: flex; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #e0dcf2; transition: all .25s ease; }
  .dot.done { background: #4caf50; transform: scale(1.15); }
  .dot.current { background: #6c5ce7; transform: scale(1.3); box-shadow: 0 0 0 3px #d9d3f8; }

  .game-area {
    display: none; flex-direction: column; align-items: center; width: 100%;
    flex: 1; min-height: 0; justify-content: flex-start; overflow: hidden;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 400px;
    min-height: 0;
    overflow-y: auto;
    padding-bottom: 4px;
  }

  .card {
    position: relative;
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    cursor: pointer;
    border: 5px solid transparent;
    transition: transform .15s ease, border-color .2s ease;
    flex-shrink: 0;
  }
  .card:active { transform: scale(0.98); }
  .card img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: #f0eef8;
    display: block;
    image-rendering: -webkit-optimize-contrast;
  }

  .badge {
    position: absolute; top: 8px; left: 8px; font-size: 30px;
    opacity: 0; transform: scale(0.4); transition: all .3s ease;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
  }
  .badge.show { opacity: 1; transform: scale(1); }
  .card.correct { border-color: #4caf50; }
  .card.wrong-flash { border-color: #ff7675; }
  .card.locked { cursor: default; }
  .card.shake { animation: shake .4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .feedback { min-height: 26px; margin-top: 8px; font-size: 15px; font-weight: 700; text-align: center; color: #3a3a5c; flex-shrink: 0; }

  .summary {
    display: none; flex-direction: column; align-items: center; text-align: center;
    background: #fff; border-radius: 22px; padding: 26px 22px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12); max-width: 420px; width: 100%;
  }
  .summary.show { display: flex; }
  .summary h2 { font-size: 22px; color: #3a3a5c; margin: 6px 0; }
  .summary .score { font-size: 34px; font-weight: 900; color: #6c5ce7; margin: 8px 0; }
  .summary .stars { font-size: 30px; margin: 6px 0 12px; letter-spacing: 4px; }
  .btn-row { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
  .restart-btn, .levels-btn {
    padding: 11px 24px; font-size: 14px; font-weight: 700; border: none; border-radius: 28px;
    color: white; cursor: pointer; box-shadow: 0 5px 14px rgba(0,0,0,0.2);
  }
  .restart-btn { background: #4caf50; }
  .levels-btn { background: #6c5ce7; }
  .restart-btn:active, .levels-btn:active { transform: scale(0.96); }
  #summaryMsg { font-size: 14px; color: #666; margin-bottom: 8px; }
</style>
</head>
<body>

<button class="sound-toggle" id="soundToggle">🔊</button>

<div class="header">
  <div class="title">🌟 أين السلوك الصحيح؟ 🌟</div>
  <div class="subtitle">رفع اليد قبل الإجابة داخل الصف</div>
</div>

<div class="levels-screen" id="levelsScreen">
  <div class="level-card" data-level="1">
    <div class="icon">✋</div>
    <div class="info">
      <div class="lvl-title">المستوى الأول</div>
      <div class="lvl-sub">اختر بين صورتين</div>
    </div>
    <div class="stars-mini" id="starsL1"></div>
  </div>
  <div class="level-card" data-level="2">
    <div class="icon">🎯</div>
    <div class="info">
      <div class="lvl-title">المستوى الثاني</div>
      <div class="lvl-sub">اختر بين ثلاث صور</div>
    </div>
    <div class="stars-mini" id="starsL2"></div>
  </div>
</div>

<div class="back-row" id="backRow">
  <button class="back-btn" id="backBtn">➡️ العودة للمستويات</button>
</div>

<div class="prompt-row" id="promptRow">
  <button class="speak-btn" id="speakBtn">🔈</button>
  <div class="prompt-box" id="promptBox">ما هو السلوك الصحيح عندما نريد الإجابة داخل الغرفة الصفّية؟</div>
</div>

<div class="progress" id="progress"></div>

<div class="game-area" id="gameArea">
  <div class="cards" id="cards"></div>
  <div class="feedback" id="feedback"></div>
</div>

<div class="summary" id="summary">
  <h2>أحسنت! 🎉</h2>
  <div class="score" id="scoreText"></div>
  <div class="stars" id="starsText"></div>
  <div id="summaryMsg"></div>
  <div class="btn-row">
    <button class="restart-btn" id="restartBtn">🔁 إعادة المستوى</button>
    <button class="levels-btn" id="levelsBtn">📋 المستويات</button>
  </div>
</div>

const QUESTION_TEXT = "ما هو السلوك الصحيح عندما نريد الإجابة داخل الغرفة الصفّية؟";
const REPS_PER_LEVEL = 5;

const LEVELS = {
  1: { pool: [IMG_RAISE, IMG_CALLOUT], correct: IMG_RAISE },
  2: { pool: [IMG_RAISE, IMG_TALKING, IMG_TEACHER], correct: IMG_RAISE }
};

/* ===== Audio elements ===== */
const aQuestion = new Audio(AUDIO_QUESTION);
const aCorrect  = new Audio(AUDIO_CORRECT);
const aWrong    = new Audio(AUDIO_WRONG);
[aQuestion, aCorrect, aWrong].forEach(a => { a.volume = 1.0; a.preload = "auto"; a.playsInline = true; });

/* Boost loudness beyond native max volume using Web Audio API (init on first user gesture) */
let audioCtx = null;
function ensureLoudAudio() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    [aQuestion, aCorrect, aWrong].forEach(a => {
      const src = audioCtx.createMediaElementSource(a);
      const gain = audioCtx.createGain();
      gain.gain.value = 1.8; /* louder & clearer */
      src.connect(gain);
      gain.connect(audioCtx.destination);
    });
  } catch (e) { /* fallback silently to normal volume */ }
}

let soundOn = true;
function playAudio(a) {
  return new Promise(resolve => {
    if (!soundOn) { resolve(); return; }
    try {
      a.currentTime = 0;
      a.onended = () => resolve();
      a.onerror = () => resolve();
      const p = a.play();
      if (p && p.catch) p.catch(() => resolve());
    } catch (e) { resolve(); }
  });
}

promptBox.textContent = QUESTION_TEXT;

/* ===== Sound toggle ===== */
soundToggle.addEventListener('click', () => {
  ensureLoudAudio();
  soundOn = !soundOn;
  soundToggle.textContent = soundOn ? '🔊' : '🔇';
  if (!soundOn) { aQuestion.pause(); aCorrect.pause(); aWrong.pause(); }
});

/* ===== Level select ===== */
document.querySelectorAll('.level-card').forEach(card => {
  card.addEventListener('click', () => { ensureLoudAudio(); startLevel(parseInt(card.dataset.level, 10)); });
});

function updateLevelStars() {
  document.getElementById('starsL1').textContent = '⭐'.repeat(stars[1]) || '';
  document.getElementById('starsL2').textContent = '⭐'.repeat(stars[2]) || '';
}
updateLevelStars();

function startLevel(level) {
  currentLevel = level;
  repIndex = 0;
  levelsScreen.classList.add('hidden');
  backRow.classList.add('show');
  promptRow.classList.add('show');
  progressEl.classList.add('show');
  gameArea.style.display = 'flex';
  summaryEl.classList.remove('show');
  buildProgressDots();
  nextRepetition();
}

document.getElementById('backBtn').addEventListener('click', goToLevels);
document.getElementById('levelsBtn').addEventListener('click', goToLevels);
document.getElementById('restartBtn').addEventListener('click', () => startLevel(currentLevel));

function goToLevels() {
  currentLevel = null;
  levelsScreen.classList.remove('hidden');
  backRow.classList.remove('show');
  promptRow.classList.remove('show');
  progressEl.classList.remove('show');
  gameArea.style.display = 'none';
  summaryEl.classList.remove('show');
  aQuestion.pause(); aCorrect.pause(); aWrong.pause();
  updateLevelStars();
}

/* ===== Progress dots ===== */
function buildProgressDots() {
  progressEl.innerHTML = '';
  for (let i = 0; i < REPS_PER_LEVEL; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = 'dot' + i;
    progressEl.appendChild(d);
  }
}
function updateProgressDots() {
  for (let i = 0; i < REPS_PER_LEVEL; i++) {
    const d = document.getElementById('dot' + i);
    d.classList.remove('current', 'done');
    if (i < repIndex) d.classList.add('done');
    else if (i === repIndex) d.classList.add('current');
  }
}

/* ===== Cyclic rotation helper (images change order in a rotating pattern each repetition) ===== */
function rotate(arr, offset) {
  const n = arr.length;
  const o = ((offset % n) + n) % n;
  return arr.slice(o).concat(arr.slice(0, o));
}

/* ===== Repetition flow ===== */
async function nextRepetition() {
  if (repIndex >= REPS_PER_LEVEL) { showSummary(); return; }
  updateProgressDots();
  feedbackEl.textContent = '';
  correctThisRep = false;

  const level = LEVELS[currentLevel];
  const options = rotate(level.pool, repIndex);
  cardsEl.className = 'cards';
  cardsEl.innerHTML = '';

  options.forEach(src => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.correct = (src === level.correct) ? '1' : '0';
    card.innerHTML = `<img src="${src}" alt="خيار"><div class="badge"></div>`;
    card.addEventListener('click', () => handleAnswer(card));
    cardsEl.appendChild(card);
  });

  busy = true;
  await playAudio(aQuestion);
  busy = false;
}

speakBtn.addEventListener('click', async () => {
  if (busy) return;
  busy = true;
  speakBtn.classList.add('speaking');
  await playAudio(aQuestion);
  speakBtn.classList.remove('speaking');
  busy = false;
});

async function handleAnswer(card) {
  if (busy || correctThisRep) return;
  const isCorrect = card.dataset.correct === '1';
  const badge = card.querySelector('.badge');

  if (isCorrect) {
    busy = true;
    correctThisRep = true;
    card.classList.add('correct', 'locked');
    document.querySelectorAll('.card').forEach(c => c.classList.add('locked'));
    badge.textContent = '✅';
    badge.classList.add('show');
    feedbackEl.textContent = 'ممتاز! هذا هو السلوك الصحيح 👏';
    await playAudio(aCorrect);
    await wait(600);
    repIndex++;
    nextRepetition();
  } else {
    busy = true;
    card.classList.add('wrong-flash', 'shake');
    badge.textContent = '❌';
    badge.classList.add('show');
    feedbackEl.textContent = 'حاول مرة أخرى 💪';
    await playAudio(aWrong);
    setTimeout(() => {
      card.classList.remove('wrong-flash', 'shake');
      badge.classList.remove('show');
      setTimeout(() => { badge.textContent = ''; }, 300);
    }, 2000);
    busy = false;
  }
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ===== Summary ===== */
function showSummary() {
  gameArea.style.display = 'none';
  promptRow.classList.remove('show');
  progressEl.classList.remove('show');
  stars[currentLevel] = 3;
  scoreText.textContent = REPS_PER_LEVEL + ' / ' + REPS_PER_LEVEL;
  starsText.textContent = '⭐⭐⭐';
  summaryMsg.textContent = 'أكملت المستوى ' + (currentLevel === 1 ? 'الأول' : 'الثاني') + ' بنجاح!';
  summaryEl.classList.add('show');
}
</script>
